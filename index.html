<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에이블리 발주 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0ed;color:#1a1a1a;min-height:100vh}

/* 헤더 */
header{background:#1a1a1a;padding:0 2rem;height:52px;display:flex;align-items:center;gap:10px}
header h1{font-size:14px;font-weight:500;color:#fff;letter-spacing:.02em}

/* 메인 탭 */
.main-tabs{display:flex;background:#fff;border-bottom:1px solid #e8e8e4;padding:0 2rem;gap:2px}
.main-tab{font-size:13px;padding:11px 18px;border:none;background:none;cursor:pointer;color:#999;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;font-weight:500;transition:color .15s}
.main-tab:hover{color:#555}
.main-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}

/* 페이지 */
.page{display:none;padding:1.5rem 2rem;max-width:1060px;margin:0 auto}
.page.active{display:block}

/* 드롭존 */
.drop{border:1.5px dashed #d0d0cc;border-radius:10px;padding:1.75rem;text-align:center;cursor:pointer;transition:all .15s;background:#fff;margin-bottom:1.25rem}
.drop:hover,.drop.drag-over{background:#f5f8ff;border-color:#6699dd}
.drop.has-file{border-color:#4a90d9;background:#f5f8ff;border-style:solid}
.drop input[type=file]{display:none}
.drop-icon{font-size:24px;margin-bottom:6px;opacity:.7}
.drop-title{font-size:14px;font-weight:500;color:#1a1a1a;margin-bottom:3px}
.drop-sub{font-size:12px;color:#999}

/* 통계 바 */
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:1.25rem;flex-wrap:wrap}
.stats{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.stat{background:#fff;border-radius:8px;padding:.6rem 1rem;border:.5px solid #e8e8e4;min-width:90px}
.stat-label{font-size:10px;color:#aaa;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.stat-value{font-size:20px;font-weight:600;color:#1a1a1a}

/* 택배 버튼 영역 */
.delivery-btn-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.btn-delivery{background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s}
.btn-delivery:hover{background:#333}
.delivery-msg{font-size:11px;color:#2a8a2a;text-align:right;display:none}
.delivery-msg.err{color:#c92d2d}

/* 서브탭 */
.sub-tabs{display:flex;border-bottom:1px solid #e8e8e4;margin-bottom:0;background:#fff;border-radius:10px 10px 0 0;padding:0 4px}
.sub-tab{font-size:13px;padding:10px 16px;border:none;background:none;cursor:pointer;color:#999;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;font-weight:500;transition:color .15s}
.sub-tab:hover{color:#555}
.sub-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}

/* 테이블 래퍼 */
.tbl-wrap{background:#fff;border-radius:0 0 10px 10px;border:.5px solid #e8e8e4;border-top:none;overflow:hidden;overflow-x:auto}

/* 테이블 공통 */
table{border-collapse:collapse;font-size:13px;min-width:400px}
table.w100{width:100%}
td{padding:9px 12px;border-bottom:.5px solid #f0f0ec;color:#1a1a1a;vertical-align:middle;white-space:nowrap;line-height:1.4}
tr:last-child td{border-bottom:none}

/* 디자인 탭 - 2열 나란히 */
.design-two-col{display:flex;gap:0;width:100%}
.design-col{flex:1;min-width:0;overflow-x:auto}
.design-col-divider{width:24px;background:transparent;flex-shrink:0;border-left:.5px solid #e4e4e0;margin:8px 0}

/* 디자인 탭 카테고리 헤더 */
.design-category{background:#fff}
.design-category-gap{margin-top:12px;border-top:2px solid #e8e8e4}
.design-category-header{padding:10px 14px;font-size:12px;font-weight:600;color:#555;background:#f5f5f2;border-bottom:.5px solid #e8e8e4;display:flex;align-items:center;gap:6px;letter-spacing:.02em}

/* 디자인 탭 */
.design-group-first td{border-top:2px solid #e4e4e0}
.design-cell{font-weight:500;border-right:.5px solid #ebebeb;position:relative;padding-left:16px;background:#fafaf8;min-width:160px}
.color-cell{color:#666;padding-left:16px;font-size:13px;border-right:.5px solid #f0f0ec}
.qty-cell{text-align:right;font-weight:600;color:#1a1a1a;font-variant-numeric:tabular-nums;padding-right:20px;min-width:52px}

/* 옷종류 탭 */
.spacer td{height:20px;background:#f0f0ed;border:none}
.col-header td{background:#f2f2ef;font-size:11px;font-weight:600;color:#888;padding:8px 12px;border-bottom:.5px solid #e4e4e0;white-space:nowrap;letter-spacing:.03em}
.col-header td.center{text-align:center}
.type-cell{font-weight:600;border-right:.5px solid #ebebeb;vertical-align:middle;padding-left:16px;position:relative;background:#fafaf8;white-space:nowrap}
.size-cell{text-align:center;font-variant-numeric:tabular-nums;color:#1a1a1a;min-width:40px}
.size-cell.empty{color:#ccc}
.subtotal-row td{background:#f2f2ef;font-weight:600;border-top:1px solid #e0e0dc;font-variant-numeric:tabular-nums}
.subtotal-row .sub-label{text-align:right;color:#999;font-size:12px;padding-right:12px}
.subtotal-row .sub-val{text-align:center;color:#666;font-weight:500}
.subtotal-row .sub-total{text-align:right;color:#1a1a1a;padding-right:20px;font-size:14px}

/* 카테고리 태그 */
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:3px;margin-right:6px;vertical-align:middle;white-space:nowrap;font-weight:600;letter-spacing:.02em}

/* 기타 카드/버튼 */
.card{background:#fff;border-radius:10px;border:.5px solid #e8e8e4;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:11px;font-weight:600;color:#aaa;margin-bottom:.85rem;text-transform:uppercase;letter-spacing:.06em}
.btn{width:100%;padding:11px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#333}
.btn:disabled{background:#ccc;cursor:not-allowed}
.result-box{border-radius:8px;padding:.9rem 1.1rem;font-size:13px;margin-top:.85rem;display:none;line-height:1.6}
.result-box.success{background:#f0faf0;color:#1a6a1a;border:.5px solid #b8ddb8}
.result-box.error{background:#fdf0f0;color:#8a1a1a;border:.5px solid #ddb8b8}
.center{text-align:center}
.muted{color:#aaa}
</style>
</head>
<body>

<header><h1><i class="ti ti-package" style="font-size:18px;margin-right:8px;vertical-align:-2px" aria-hidden="true"></i>에이블리 발주 관리</h1></header>

<div class="main-tabs">
  <button class="main-tab active" onclick="switchMain(this,'order')"><i class="ti ti-chart-bar" aria-hidden="true"></i> 발주 수량 정리</button>
  <button class="main-tab" onclick="switchMain(this,'delivery')"><i class="ti ti-truck-delivery" aria-hidden="true"></i> 택배 변환</button>
  <button class="main-tab" onclick="switchMain(this,'invoice')"><i class="ti ti-file-invoice" aria-hidden="true"></i> 송장 입력</button>
</div>

<!-- 발주 수량 정리 -->
<div class="page active" id="page-order">
  <div class="drop" id="orderDrop">
    <div class="drop-icon">📂</div>
    <div class="drop-title">발주 엑셀 파일 업로드</div>
    <div class="drop-sub">클릭하거나 파일을 드래그하세요 (.xlsx)</div>
    <input type="file" id="orderFile" accept=".xlsx,.xls">
  </div>
  <div id="orderResult" style="display:none">
    <div class="top-bar">
      <div class="stats" id="orderStats"></div>
      <div class="delivery-btn-wrap">
        <button class="btn-delivery" onclick="convertOrderDelivery()"><i class="ti ti-download" style="margin-right:6px" aria-hidden="true"></i>택배 접수 파일 다운로드</button>
        <div class="delivery-msg" id="orderDeliveryResult"></div>
      </div>
    </div>
    <div class="sub-tabs">
      <button class="sub-tab active" onclick="switchSub(this,'design')">디자인 / 색상</button>
      <button class="sub-tab" onclick="switchSub(this,'type')">옷종류 / 색상 / 사이즈</button>
    </div>
    <div class="tbl-wrap"><div id="orderTable"></div></div>
  </div>
</div>

<!-- 택배 변환 -->
<div class="page" id="page-delivery">
  <div class="card">
    <div class="card-title">1. 발주 파일 선택</div>
    <div class="drop" id="deliveryDrop">
      <div class="drop-icon">📦</div>
      <div class="drop-title">에이블리 발주 엑셀 파일</div>
      <div class="drop-sub">클릭하거나 파일을 드래그하세요 (.xlsx)</div>
      <input type="file" id="deliveryFile" accept=".xlsx,.xls">
    </div>
  </div>
  <button class="btn" id="convertBtn" onclick="convertDelivery()" disabled>변환 후 다운로드</button>
  <div class="result-box" id="deliveryResult"></div>
</div>

<!-- 송장 입력 -->
<div class="page" id="page-invoice">
  <div class="card">
    <div class="card-title">1. 발주 파일 선택</div>
    <div class="drop" id="invOrderDrop">
      <div class="drop-icon">📋</div>
      <div class="drop-title">에이블리 발주 엑셀 파일</div>
      <div class="drop-sub">클릭하거나 파일을 드래그하세요 (.xlsx)</div>
      <input type="file" id="invOrderFile" accept=".xlsx,.xls">
    </div>
  </div>
  <div class="card">
    <div class="card-title">2. 송장 파일 선택</div>
    <div class="drop" id="invInvoiceDrop">
      <div class="drop-icon">🔖</div>
      <div class="drop-title">택배사 송장 엑셀 파일</div>
      <div class="drop-sub">클릭하거나 파일을 드래그하세요 (.xlsx)</div>
      <input type="file" id="invInvoiceFile" accept=".xlsx,.xls">
    </div>
  </div>
  <div class="card" id="invMatchCard" style="display:none">
    <div class="card-title">3. 매칭 상태</div>
    <div id="invMatchStatus" style="font-size:13px;color:#555"></div>
  </div>
  <button class="btn" id="invMergeBtn" onclick="mergeInvoice()" disabled>송장번호 입력 후 다운로드</button>
  <div class="result-box" id="invResult"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
function switchMain(btn,page){document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById('page-'+page).classList.add('active');}

const PALETTE=[{bg:'#e8f0fb',color:'#2d6fc9',bar:'#2d6fc9'},{bg:'#fce8f3',color:'#c9367a',bar:'#c9367a'},{bg:'#e8fbe8',color:'#2a8a2a',bar:'#2a8a2a'},{bg:'#fff3e0',color:'#c97a00',bar:'#c97a00'},{bg:'#f3e8fb',color:'#7a2dc9',bar:'#7a2dc9'},{bg:'#e8faf8',color:'#1a8a7a',bar:'#1a8a7a'},{bg:'#fbe8e8',color:'#c92d2d',bar:'#c92d2d'},{bg:'#f5fbe8',color:'#6a8a1a',bar:'#6a8a1a'}];
const catColorMap={};let colorIdx=0;
function resetColors(){Object.keys(catColorMap).forEach(k=>delete catColorMap[k]);colorIdx=0;}
function getCatColor(tk){const base=tk.replace(/\(.*\)/,'').trim();if(!catColorMap[base]){catColorMap[base]=PALETTE[colorIdx%PALETTE.length];colorIdx++;}return catColorMap[base];}
function tagHtml(tk){const c=getCatColor(tk);return `<span class="tag" style="background:${c.bg};color:${c.color}">${tk}</span>`;}
function splitCode(code){const c=String(code||'');const i=c.indexOf('_');if(i<0)return{type:c,design:c};return{type:c.slice(0,i),design:c.slice(i+1)};}
function is11(code){return String(code||'').includes('1+1');}
function isFleece(str){return /기모|노기모|fleece/i.test(str);}
function parseOpt(optStr,f11){
  const str=String(optStr||'').trim();const parts=str.split('/').map(p=>p.trim());
  if(f11&&parts.length>=6&&!isFleece(parts[0]))return[{fleece:null,design:parts[0],color:parts[1],size:parts[2]},{fleece:null,design:parts[3],color:parts[4],size:parts[5]}];
  if(parts.length>=3&&isFleece(parts[0])){const fl=parts[0].split('_')[0].trim();const co=parts[1].split('_')[0].trim();return[{fleece:fl,design:null,color:co,size:parts[2].trim()}];}
  const color=(parts[0]||'').split('_')[0].trim();const size=(parts[1]||'').trim();
  return[{fleece:null,design:null,color,size}];
}
function setupDrop(dropEl,fileInput,onFile){
  dropEl.addEventListener('click',()=>fileInput.click());
  dropEl.addEventListener('dragover',e=>{e.preventDefault();dropEl.classList.add('drag-over');});
  dropEl.addEventListener('dragleave',()=>dropEl.classList.remove('drag-over'));
  dropEl.addEventListener('drop',e=>{e.preventDefault();dropEl.classList.remove('drag-over');if(e.dataTransfer.files[0])onFile(e.dataTransfer.files[0]);});
  fileInput.addEventListener('change',e=>{if(e.target.files[0])onFile(e.target.files[0]);});
}
function readExcel(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]),wb);};
  reader.readAsArrayBuffer(file);
}
function markDrop(dropEl,fname){
  dropEl.classList.add('has-file');
  dropEl.querySelector('.drop-title').textContent=fname;
  dropEl.querySelector('.drop-sub').textContent='다른 파일을 선택하려면 클릭';
}

// ── 발주 수량 정리 ──
let orderRows=[],orderSubTab='design';

setupDrop(document.getElementById('orderDrop'),document.getElementById('orderFile'),file=>{
  readExcel(file,rows=>{
    orderRows=rows;resetColors();
    let totalQty=0;const designs=new Set(),types=new Set();
    rows.forEach(r=>{totalQty+=Number(r['수량'])||1;designs.add(r['상품명']);types.add(splitCode(r['판매자 상품코드']).type);});
    document.getElementById('orderStats').innerHTML=`
      <div class="stat"><div class="stat-label">총 수량</div><div class="stat-value">${totalQty}</div></div>
      <div class="stat"><div class="stat-label">디자인</div><div class="stat-value">${designs.size}</div></div>
      <div class="stat"><div class="stat-label">옷 종류</div><div class="stat-value">${types.size}</div></div>
      <div class="stat"><div class="stat-label">주문</div><div class="stat-value">${rows.length}</div></div>`;
    markDrop(document.getElementById('orderDrop'),file.name);
    document.getElementById('orderResult').style.display='block';
    renderOrderTab();
  });
});

function switchSub(btn,tab){orderSubTab=tab;document.querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');renderOrderTab();}
function renderOrderTab(){orderSubTab==='design'?renderDesign():renderType();}

function renderDesign(){
  const map={};
  orderRows.forEach(r=>{
    const qty=Number(r['수량'])||1;const f11=is11(r['판매자 상품코드']);
    const{type,design:cd}=splitCode(r['판매자 상품코드']);
    parseOpt(r['옵션 정보'],f11).forEach(opt=>{
      const dn=opt.design||cd;const key=type+'|'+dn;
      if(!map[key])map[key]={type,design:dn,colors:{}};
      map[key].colors[opt.color]=(map[key].colors[opt.color]||0)+qty;
    });
  });

  // 카테고리별로 그룹핑
  const byType={};
  Object.values(map).sort((a,b)=>a.type.localeCompare(b.type,'ko')||a.design.localeCompare(b.design,'ko')).forEach(item=>{
    if(!byType[item.type])byType[item.type]=[];
    byType[item.type].push(item);
  });

  function buildRows(list){
    return list.map(({type,design,colors})=>{
      const c=getCatColor(type);
      const cl=Object.entries(colors).sort((a,b)=>a[0].localeCompare(b[0],'ko'));
      return cl.map(([color,qty],i)=>{
        const isFirst=i===0;
        return `<tr class="${isFirst?'design-group-first':''}">
          ${isFirst?`<td class="design-cell" rowspan="${cl.length}" style="border-right:.5px solid #ebebeb">
            <span style="position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:${c.bar}"></span>
            ${design}
          </td>`:''}
          <td class="color-cell">${color}</td>
          <td class="qty-cell">${qty}</td>
        </tr>`;
      }).join('');
    }).join('');
  }

  let html='';
  Object.entries(byType).forEach(([type,items],gi)=>{
    const c=getCatColor(type);
    const left=items.filter((_,i)=>i%2===0);
    const right=items.filter((_,i)=>i%2===1);
    html+=`
      <div class="design-category${gi>0?' design-category-gap':''}">
        <div class="design-category-header" style="border-left:3px solid ${c.bar}">
          ${tagHtml(type)}
        </div>
        <div class="design-two-col">
          <div class="design-col">
            <table class="w100"><tbody>${buildRows(left)}</tbody></table>
          </div>
          <div class="design-col-divider"></div>
          <div class="design-col">
            <table class="w100"><tbody>${buildRows(right)}</tbody></table>
          </div>
        </div>
      </div>`;
  });

  document.getElementById('orderTable').innerHTML=html;
}

function initResize(){} // 카드형에서 미사용

function renderType(){
  const sizeOrder=['XS','S','M','L','XL','2XL','3XL'];const map={};
  orderRows.forEach(r=>{
    const{type}=splitCode(r['판매자 상품코드']);const qty=Number(r['수량'])||1;const f11=is11(r['판매자 상품코드']);
    parseOpt(r['옵션 정보'],f11).forEach(opt=>{
      const tk=opt.fleece?`${type}(${opt.fleece})`:type;
      if(!map[tk])map[tk]={};if(!map[tk][opt.color])map[tk][opt.color]={};
      map[tk][opt.color][opt.size]=(map[tk][opt.color][opt.size]||0)+qty;
    });
  });
  const allSizes=new Set();
  Object.values(map).forEach(c=>Object.values(c).forEach(s=>Object.keys(s).forEach(k=>allSizes.add(k))));
  const sizes=[...allSizes].sort((a,b)=>{const ai=sizeOrder.indexOf(a),bi=sizeOrder.indexOf(b);if(ai>=0&&bi>=0)return ai-bi;if(ai>=0)return -1;if(bi>=0)return 1;return a.localeCompare(b);});

  const hdr=()=>`<tr class="col-header"><td>옷 종류</td><td>색상</td>${sizes.map(s=>`<td class="center">${s}</td>`).join('')}<td style="text-align:right;padding-right:16px">소계</td></tr>`;
  let html=`<table class="w100"><tbody>`;
  const typeKeys=Object.keys(map).sort((a,b)=>a.localeCompare(b,'ko'));

  typeKeys.forEach((tk,idx)=>{
    const colors=map[tk];
    const typeTotal=Object.values(colors).reduce((s,sz)=>s+Object.values(sz).reduce((a,b)=>a+b,0),0);
    const tsz={};
    const cl=Object.entries(colors).sort((a,b)=>a[0].localeCompare(b[0],'ko'));
    const c=getCatColor(tk);

    if(idx>0)html+=`<tr class="spacer"><td colspan="${2+sizes.length+1}"></td></tr>`;
    html+=hdr();

    let first=true;
    cl.forEach(([color,szMap])=>{
      const ct=Object.values(szMap).reduce((a,b)=>a+b,0);
      html+=`<tr>`;
      if(first){
        html+=`<td class="type-cell" rowspan="${cl.length+1}" style="color:${c.color}">
          <span style="position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:${c.bar}"></span>
          ${tk}
        </td>`;
        first=false;
      }
      html+=`<td class="color-cell">${color}</td>`;
      sizes.forEach(s=>{const v=szMap[s]||0;tsz[s]=(tsz[s]||0)+v;html+=`<td class="${v?'size-cell':'size-cell empty'}">${v||''}</td>`;});
      html+=`<td style="text-align:right;font-weight:600;padding-right:16px">${ct}</td></tr>`;
    });
    html+=`<tr class="subtotal-row">
      <td class="sub-label">소계</td>
      ${sizes.map(s=>`<td class="sub-val">${tsz[s]||''}</td>`).join('')}
      <td class="sub-total">${typeTotal}</td>
    </tr>`;
  });

  html+=`</tbody></table>`;
  document.getElementById('orderTable').innerHTML=html;
}

// ── 발주 탭 내 택배 변환 ──
function convertOrderDelivery(){
  const msgEl=document.getElementById('orderDeliveryResult');
  msgEl.className='delivery-msg';msgEl.style.display='none';
  if(!orderRows||!orderRows.length){msgEl.className='delivery-msg err';msgEl.style.display='block';msgEl.textContent='발주 파일을 먼저 업로드해주세요.';return;}
  try{
    const today=new Date().toISOString().slice(0,10).replace(/-/g,'');
    function cleanOpt(opt){return String(opt).split('/').map(p=>{p=p.trim();return p.includes('_')?p.split('_')[0].trim():p;}).join('/');}
    const headers=['예약구분','집하예정일','받는분성명','받는분전화번호','받는분기타연락처','받는분우편번호','받는분주소(전체, 분할)','운송장번호','고객주문번호','품목명','박스수량','박스타입','기본운임','배송메세지1','배송메세지2','품목명.1','운임구분'];
    const wsData=[headers];
    const sorted=[...orderRows].sort((a,b)=>{const pa=`${a['판매자 상품코드']}/${cleanOpt(a['옵션 정보'])}`;const pb=`${b['판매자 상품코드']}/${cleanOpt(b['옵션 정보'])}`;return pa.localeCompare(pb,'ko');});
    sorted.forEach(r=>{
      const memo=(!r['배송 메모']||String(r['배송 메모'])==='nan')?'':String(r['배송 메모']);
      wsData.push(['',today,r['수취인명'],String(r['수취인 연락처']),'',String(r['우편번호']),r['배송지 주소'],'','',`${r['판매자 상품코드']}/${cleanOpt(r['옵션 정보'])}`,1,'극소',2000,memo,'','','']);
    });
    const wb2=XLSX.utils.book_new();const ws2=XLSX.utils.aoa_to_sheet(wsData);
    ws2['!cols']=[8,12,12,16,16,12,45,14,14,45,8,8,10,20,20,10,10].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb2,ws2,'택배발송');
    XLSX.writeFile(wb2,today+'_택배발송.xlsx');
    msgEl.className='delivery-msg';msgEl.style.display='block';msgEl.textContent=`✅ ${sorted.length}건 다운로드 완료`;
  }catch(e){msgEl.className='delivery-msg err';msgEl.style.display='block';msgEl.textContent=`오류: ${e.message}`;}
}

    sorted.forEach(r=>{

      wsData.push(['',today,r['수취인명'],String(r['수취인 연락처']),'',String(r['우편번호']),r['배송지 주소'],'','',`${r['판매자 상품코드']}/${cleanOpt(r['옵션 정보'])}`,1,'극소',2000,memo,'','','']);

    ws2['!cols']=[8,12,12,16,16,12,45,14,14,45,8,8,10,20,20,10,10].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb2,ws2,'택배발송');

    resultEl.className='result-box success';resultEl.innerHTML=`✅ 변환 완료! <b>${sorted.length}건</b> → <b>${today}_택배발송.xlsx</b>`;

// ── 송장 입력 ──
let invOrderWb=null,invOrderRows=[],invOrderSheetName='';
let invInvoiceRows=[],invOrderCols=[],invInvoiceCols=[];

setupDrop(document.getElementById('invOrderDrop'),document.getElementById('invOrderFile'),file=>{
  const reader=new FileReader();
  reader.onload=e=>{
    invOrderWb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    let sheetIdx=invOrderWb.SheetNames.length>1?1:0;
    invOrderSheetName=invOrderWb.SheetNames[sheetIdx];
    const ws=invOrderWb.Sheets[invOrderSheetName];
    invOrderRows=XLSX.utils.sheet_to_json(ws);
    const range=XLSX.utils.decode_range(ws['!ref']||'A1');
    invOrderCols=[];
    for(let c=range.s.c;c<=range.e.c;c++){const cell=ws[XLSX.utils.encode_cell({r:range.s.r,c})];if(cell&&cell.v!==undefined)invOrderCols.push(String(cell.v));}
    markDrop(document.getElementById('invOrderDrop'),file.name+` (${invOrderSheetName}, ${invOrderCols.length}개 컬럼)`);
    updateInvMatchCard();
  };
  reader.readAsArrayBuffer(file);
});

setupDrop(document.getElementById('invInvoiceDrop'),document.getElementById('invInvoiceFile'),file=>{
  readExcel(file,rows=>{invInvoiceRows=rows;invInvoiceCols=Object.keys(rows[0]||{});markDrop(document.getElementById('invInvoiceDrop'),file.name);updateInvMatchCard();});
});

function updateInvMatchCard(){
  if(!invOrderRows.length||!invInvoiceRows.length)return;
  const hasSongjanCol=invOrderCols.includes('송장번호');
  const hasOrderKey=invOrderCols.includes('수취인 연락처');
  const hasInvoiceKey=invInvoiceCols.includes('받는분전화번호');
  const hasInvoiceNum=invInvoiceCols.includes('운송장번호');
  const sheetInfo=invOrderWb&&invOrderWb.SheetNames.length>1?` (${invOrderSheetName} 시트)`:'';
  const ok=v=>v?'<span style="color:#2a8a2a">✅</span>':'<span style="color:#c92d2d">⚠ 없음</span>';
  document.getElementById('invMatchCard').style.display='block';
  document.getElementById('invMatchStatus').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:8px;font-size:13px">
      <div>📋 발주 파일 키 <b>수취인 연락처</b> ${ok(hasOrderKey)}</div>
      <div>🔖 송장 파일 키 <b>받는분전화번호</b> ${ok(hasInvoiceKey)}</div>
      <div>📦 송장번호 컬럼 <b>운송장번호</b> ${ok(hasInvoiceNum)}</div>
      <div style="margin-top:4px;padding-top:8px;border-top:.5px solid #eee;color:#555">
        ${hasSongjanCol?`✅ 발주 파일${sheetInfo}의 <b>송장번호</b> 컬럼에 자동 입력됩니다.`:`➕ 발주 파일${sheetInfo}에 <b>송장번호</b> 컬럼을 추가합니다.`}
      </div>
    </div>`;
  document.getElementById('invMergeBtn').disabled=!(hasOrderKey&&hasInvoiceKey&&hasInvoiceNum);
}

function mergeInvoice(){
  const btn=document.getElementById('invMergeBtn');const resultEl=document.getElementById('invResult');
  btn.disabled=true;btn.textContent='처리 중...';resultEl.style.display='none';
  try{
    const orderKey='수취인 연락처';const invoiceKey='받는분전화번호';const invoiceNumCol='운송장번호';
    const invoiceMap={};
    invInvoiceRows.forEach(r=>{
      const key=String(r[invoiceKey]||'').replace(/[-\s]/g,'');
      const num=String(r[invoiceNumCol]||'').replace(/[^0-9]/g,'');
      if(key&&num&&num!=='undefined'&&num!=='nan')invoiceMap[key]=num;
    });
    let matched=0,unmatched=0;
    const ws=invOrderWb.Sheets[invOrderSheetName];
    const range=XLSX.utils.decode_range(ws['!ref']);
    let orderKeyColIdx=-1,invoiceColIdx=-1;
    for(let c=range.s.c;c<=range.e.c;c++){
      const cell=ws[XLSX.utils.encode_cell({r:range.s.r,c})];
      if(cell&&cell.v===orderKey)orderKeyColIdx=c;
      if(cell&&cell.v==='송장번호')invoiceColIdx=c;
    }
    if(invoiceColIdx<0){invoiceColIdx=range.e.c+1;ws[XLSX.utils.encode_cell({r:range.s.r,c:invoiceColIdx})]={v:'송장번호',t:'s'};range.e.c=invoiceColIdx;ws['!ref']=XLSX.utils.encode_range(range);}
    for(let r=range.s.r+1;r<=range.e.r;r++){
      if(orderKeyColIdx<0)break;
      const keyCell=ws[XLSX.utils.encode_cell({r,c:orderKeyColIdx})];if(!keyCell)continue;
      const key=String(keyCell.v||'').replace(/[-\s]/g,'');
      const invNum=invoiceMap[key];
      if(invNum){ws[XLSX.utils.encode_cell({r,c:invoiceColIdx})]={v:invNum,t:'s'};matched++;}else{unmatched++;}
    }
    const today=new Date().toISOString().slice(0,10).replace(/-/g,'');
    const outName=`${today}_에이블리_발송_송장.xlsx`;
    XLSX.writeFile(invOrderWb,outName);
    resultEl.className='result-box success';
    resultEl.innerHTML=`✅ 완료! 매칭 <b>${matched}건</b> / 미매칭 <b style="color:#c97a00">${unmatched}건</b><br><span style="font-size:12px">→ <b>${outName}</b> 다운로드됨</span>`;
  }catch(e){resultEl.className='result-box error';resultEl.innerHTML=`❌ 오류: ${e.message}`;}
  btn.disabled=false;btn.textContent='송장번호 입력 후 다운로드';resultEl.style.display='block';
}
